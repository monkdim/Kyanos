name: OS boot smoke test

# Builds the KyanOS kernel and boots it headlessly under QEMU, asserting
# the kernel reaches its "KyanOS ready." serial marker.
#
# The image is the kernel alone: both kernels carry their userspace (a Zig
# init and a compiled Clarity program) inside the image, so a GRUB rescue
# ISO holding just the kernel is the whole x86_64 boot, and the ARM64 Image
# is the whole aarch64 one. GitHub runners have no /dev/kvm, so QEMU runs
# under TCG, hence the generous timeouts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  os-boot:
    runs-on: ubuntu-latest
    name: OS boot (linux-x64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU + GRUB rescue tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version | head -1
          zig version

      - name: Build the kernel
        run: |
          cd kernel
          zig build
          test -f zig-out/bin/clarity-kernel

      # The modules no kernel imports.
      #
      # Zig never parses a file nothing reaches, so `zig build` above says
      # nothing at all about drivers/tty.zig, fs/devfs.zig, fs/procfs.zig or
      # boot/uefi.zig — a line of deliberate nonsense in any of them builds
      # clean. That was measured on all four, against both `zig build` and
      # `zig build aarch64`, and it is why this step exists rather than being
      # assumed unnecessary.
      #
      # It does not claim any of them works; nothing in them has ever run, and
      # kernel/README.md says so. It claims they are still valid Zig against
      # the code they refer to, which is what stops them rotting in silence.
      - name: Compile the modules no kernel imports
        run: |
          cd kernel
          zig build check

      - name: Assemble a minimal GRUB rescue ISO (kernel only)
        run: |
          mkdir -p isodir/boot/grub
          cp kernel/zig-out/bin/clarity-kernel isodir/boot/clarity-kernel
          cat > isodir/boot/grub/grub.cfg <<'CFG'
          set timeout=0
          set default=0
          menuentry "KyanOS" {
              multiboot2 /boot/clarity-kernel
              boot
          }
          CFG
          grub-mkrescue -o clarity-kernel.iso isodir
          test -f clarity-kernel.iso

      - name: Boot the kernel under QEMU and assert the ready marker
        run: |
          # Boot the SAME image three times. A kernel that only sometimes
          # reaches userspace is a real defect, so the gate requires every
          # attempt to succeed rather than just one.
          #
          # Three markers, each proving a further step:
          #   "KyanOS ready."         -- the kernel finished initialising
          #   "[ok] context switch"      -- two kernel threads ran, and
          #   "[A] round 1"                 thread A resumed *inside* the
          #                                 yield it called rather than at its
          #                                 entry point, which is the half of
          #                                 a context switch that is easy to
          #                                 get wrong
          #   "[B] round 1"              -- and the two threads really are two
          #                                 threads. They are one function told
          #                                 which one it is, so both letters
          #                                 appear only if each received its
          #                                 argument. That never worked until
          #                                 recently, and could not be seen
          #                                 while every caller passed zero
          #   "[ok] preemption"          -- the timer took the CPU away from a
          #                                 thread that never yielded, and gave
          #                                 it back; cooperative scheduling
          #                                 cannot produce this line
          #   "[ok] fpu switch"          -- the x87/SSE state travels with the
          #                                 thread: two threads each kept a
          #                                 live floating-point register across
          #                                 200 switches to the other. Before
          #                                 FXSAVE was in the switch path they
          #                                 shared one set of registers
          #   "[ok] vfs"                 -- a path resolved: a file was created,
          #                                 written, and read back by name
          #   "[ok] user .bss zeroed"    -- the loader zero-filled the part of
          #                                 the last page that has no file
          #                                 behind it, which one hand-made
          #                                 segment could never have shown
          #   "[ok] user sse"            -- SSE is enabled for ring 3: the user
          #                                 program divided two doubles and got
          #                                 the exact bit pattern. Without
          #                                 CR4.OSFXSR that instruction is #UD,
          #                                 which is where every compiled
          #                                 Clarity program would have died
          #   "[ok] user heap"           -- brk grew the process's heap and
          #                                 the pages it mapped are really
          #                                 there: the program writes through
          #                                 the new break and reads it back
          #   "[ok] user pointers"       -- the kernel refused three buffers a
          #                                 process handed it: one nothing
          #                                 maps, one in the kernel's half,
          #                                 and one in the program's own
          #                                 read-only text as a read(2)
          #                                 target. Each was a page fault in
          #                                 ring 0 before user addresses were
          #                                 translated through the process's
          #                                 tables; now each is EFAULT, and
          #                                 the same read into a real buffer
          #                                 then gets the file
          #   "hello from /bin/..."      -- an ELF was read out of the
          #                                 filesystem, parsed, mapped into a
          #                                 fresh address space, and run at
          #                                 CPL 3, and its `syscall` reached
          #                                 the kernel with the arguments the
          #                                 program passed
          #   "[exit] status=0"          -- SYSRET returned to ring 3 and a
          #                                 *second* syscall arrived, which is
          #                                 the only evidence that the return
          #                                 path works at all
          #   "demo: wrote"              -- a *second* process: the first one
          #                                 exited and the kernel carried on,
          #                                 which it could not do while the
          #                                 boot path entered ring 3 by hand
          #                                 and never came back
          #   "clarity-demo: all ..."    -- and that second process is a
          #                                 Clarity program: compiled by
          #                                 `clarity cc --freestanding`,
          #                                 linked against kernel/user/libc,
          #                                 loaded out of the filesystem and
          #                                 run at CPL 3. The line is last in
          #                                 the program, so reaching it means
          #                                 the class, the try/catch/finally,
          #                                 the sorted map, the float
          #                                 formatting and 400 allocations all
          #                                 came out right
          #   "float 3.14159292..."      -- printf %g and strtod agreeing in
          #                                 ring 3, on SSE the kernel had to
          #                                 enable, over a heap brk had to grow
          #   "KyanOS: userspace ..."  -- and the kernel outlived both
          # -no-reboot: halt instead of looping if the kernel faults.
          fails=0
          for attempt in 1 2 3; do
            echo "=== boot attempt $attempt ==="
            timeout 45 qemu-system-x86_64 \
              -cdrom clarity-kernel.iso \
              -boot d \
              -m 512 \
              -serial stdio \
              -display none \
              -no-reboot \
              > "serial-$attempt.log" 2>&1 || true
            cat "serial-$attempt.log"
            missing=""
            grep -q "KyanOS ready." "serial-$attempt.log" || missing="$missing ready"
            grep -q "\[ok\] context switch" "serial-$attempt.log" || missing="$missing ctxswitch"
            grep -q "\[A\] round 1" "serial-$attempt.log" || missing="$missing thread-resumed"
            # Both letters, because both threads are the same function told
            # which one it is. A kernel thread that did not receive its
            # argument prints whatever garbage arrived in its place — which
            # is what happened for as long as this test existed, and was
            # invisible while the two threads were two separate functions.
            grep -q "\[B\] round 1" "serial-$attempt.log" || missing="$missing thread-argument"
            grep -q "\[ok\] preemption" "serial-$attempt.log" || missing="$missing preemption"
            # The window between the scheduler choosing a thread and switching
            # to it, held open on purpose so a tick lands inside it. Without
            # the guard in yield(), the same build does not survive this test
            # — which is the only reason the zero it reports means anything.
            grep -q "\[ok\] preempt window" "serial-$attempt.log" || missing="$missing preempt-window"
            grep -q "\[ok\] fpu switch" "serial-$attempt.log" || missing="$missing fpu-switch"
            grep -q "\[ok\] vfs" "serial-$attempt.log" || missing="$missing vfs"
            grep -q "\[ok\] vfs: readdir packed" "serial-$attempt.log" || missing="$missing vfs-readdir"
            grep -q "hello from /bin/clarity-init" "serial-$attempt.log" || missing="$missing init-process"
            grep -q "\[ok\] user .bss zeroed" "serial-$attempt.log" || missing="$missing user-bss"
            grep -q "\[ok\] user heap" "serial-$attempt.log" || missing="$missing user-heap"
            grep -q "\[ok\] user sse" "serial-$attempt.log" || missing="$missing user-sse"
            grep -q "\[ok\] user pointers" "serial-$attempt.log" || missing="$missing user-pointers"
            grep -q "\[exit\] status=0" "serial-$attempt.log" || missing="$missing sysret-return"
            # The three calls a shell makes, in the order it makes them.
            # Each one prints [FAIL] of its own accord when it goes wrong, and
            # the no-[FAIL] check below catches that -- but a gate that stops
            # running at all prints nothing, and silence is what these three
            # lines are here to refuse.
            grep -q "\[ok\] fork:" "serial-$attempt.log" || missing="$missing fork"
            grep -q "\[ok\] wait:" "serial-$attempt.log" || missing="$missing wait"
            grep -q "\[ok\] fork+exec:" "serial-$attempt.log" || missing="$missing fork-exec"
            grep -q "demo: wrote" "serial-$attempt.log" || missing="$missing second-process"
            grep -q "clarity-demo: all checks passed" "serial-$attempt.log" || missing="$missing clarity-program"
            grep -q "float 3.1415929203539825 1.4142135623730951 6.25" "serial-$attempt.log" || missing="$missing clarity-floats"
            grep -q "KyanOS: userspace complete." "serial-$attempt.log" || missing="$missing kernel-outlived"
            # And that nothing said it failed. Every check above asks whether
            # an expected line is present, which means a selftest that runs
            # and reports [FAIL] passes the gate in silence. That is not
            # hypothetical: the aarch64 boot printed "[FAIL] thread stacks
            # leaked" on every run for a whole pull request without the gate
            # noticing, because no grep was looking for it.
            grep -q "\[FAIL\]" "serial-$attempt.log" && missing="$missing no-[FAIL]-lines"
            if [ -z "$missing" ]; then
              echo "--> attempt $attempt: PASS"
            else
              echo "--> attempt $attempt: FAIL (missing:$missing)"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -ne 0 ]; then
            echo "FAIL: $fails of 3 boots did not reach userspace and back"
            exit 1
          fi
          echo "PASS: all 3 boots ran two processes, the second a compiled Clarity program"

      # The same image on a CPU that enforces the rule the kernel follows.
      #
      # Every access to a process's memory goes through mm/uaccess.zig and
      # the direct map; the kernel never touches a user address itself. On
      # qemu64, the default above, nothing checks that: a syscall that still
      # dereferenced a user pointer would work. `-cpu max` has SMEP and SMAP,
      # the kernel turns them on and says so, and from then on any such path
      # is a page fault in ring 0, which the boot log shows and this step
      # fails on. The aarch64 job does the same with PAN and `-cpu max`.
      - name: Boot on a CPU with SMEP and SMAP and assert the same markers
        run: |
          timeout 45 qemu-system-x86_64 \
            -cpu max \
            -cdrom clarity-kernel.iso \
            -boot d \
            -m 512 \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-smap.log 2>&1 || true
          cat serial-smap.log
          missing=""
          grep -q "\[ok\] smep+smap" serial-smap.log || missing="$missing smep-smap-enabled"
          grep -q "\[ok\] preempt window" serial-smap.log || missing="$missing preempt-window"
          grep -q "\[ok\] user pointers" serial-smap.log || missing="$missing user-pointers"
          # fork and exec both fill a process's pages from ring 0 — exec
          # writes a program image into a fresh address space, fork copies
          # the parent's pages one at a time. They are meant to do it through
          # the direct map, at kernel addresses, the way mm/uaccess.zig does;
          # this kernel has no stac/clac anywhere, so a path that reached for
          # a user address instead has nothing to lift SMAP for it and faults
          # in ring 0. That is what this line is asking: not that SMAP works,
          # which the marker above already says, but that the two calls that
          # write most heavily into user memory are not the exception.
          grep -q "\[ok\] fork+exec:" serial-smap.log || missing="$missing fork-exec"
          grep -q "clarity-demo: all checks passed" serial-smap.log || missing="$missing clarity-program"
          grep -q "KyanOS: userspace complete." serial-smap.log || missing="$missing kernel-outlived"
          grep -q "\[FAIL\]" serial-smap.log && missing="$missing no-[FAIL]-lines"
          if [ -n "$missing" ]; then
            echo "FAIL: with SMEP and SMAP enforced, missing:$missing"
            exit 1
          fi
          echo "PASS: two processes ran with SMEP and SMAP enforced; the kernel touched no user page directly"

      # ── The developer command produces the same boot ───────────────────
      #
      # Everything above is what this workflow does by hand. `clarity os
      # build` and `clarity os run` are what a person is told to run, so the
      # gate proves those give the same boot: the same kernel build, the same
      # image recipe, the same QEMU flags, the same serial marker. Before this
      # step existed `clarity os build` tried to build a QuickJS runtime that
      # nothing vendors and stopped there, and the image it would have written
      # was not bootable; the docs called it the developer workflow anyway.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the clarity binary
        run: |
          rm -rf native/dist
          python native/transpile.py --bundle
          (cd native/dist && bun build --compile clarity-entry.js --outfile clarity)

      - name: clarity os build writes the image and clarity os run boots it (x86_64)
        run: |
          rm -rf dist
          ./native/dist/clarity os build --arch x86_64
          test -f dist/claritos.iso
          ./native/dist/clarity os run --arch x86_64 --no-rebuild --boot-test --timeout 60

  os-boot-aarch64:
    runs-on: ubuntu-latest
    name: OS boot (aarch64, TCG)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install QEMU (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version | head -1
          zig version

      # graphics/font8x8.zig is generated from tools/font8x8.txt and checked
      # in, so building the kernel needs no Python. This is what stops the two
      # drifting: edit the text file without regenerating and the boot gate
      # says so, rather than the screen quietly showing the old glyphs.
      - name: The console font is not stale
        run: |
          cd kernel
          python3 tools/make_font.py --check

      - name: Build the aarch64 kernel
        run: |
          cd kernel
          zig build aarch64
          test -f zig-out/bin/clarity-kernel-aarch64
          test -f zig-out/bin/clarity-kernel-aarch64.img

      - name: Boot the aarch64 kernel under QEMU and assert the marker
        run: |
          echo "Booting KyanOS aarch64 (QEMU virt, TCG)..."
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 512 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64.img \
            -device ramfb \
            -device virtio-keyboard-device \
            -append "clarity.idle=3" \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm.log
          echo "-------------------------"
          # Two markers. The boot marker says the kernel reached EL1 with the
          # MMU on; the timer one says an interrupt was actually delivered —
          # the vectors had been installed since the ARM kernel first booted
          # and nothing had ever reached them.
          # The device tree marker says the kernel was handed one and parsed
          # it. That only happens because the image now carries an ARM64
          # Image header: given an ELF, QEMU jumps to the entry point and
          # loads no device tree at all, so x0 arrives empty.
          #
          # The pmm marker says a page was allocated, written through, read
          # back, freed, and that the page came from outside the kernel image
          # — allocating alone would prove only that a bit was flipped.
          #
          # The framebuffer marker says the kernel configured ramfb through
          # fw_cfg and read its own pattern back out of the display memory.
          # It does not say the machine is showing it — that is the next step.
          #
          # The address-space marker is the strongest of them. The kernel is
          # linked for the high half and runs with no identity map, and that
          # line is printed only when the *translation hardware* agrees: an
          # `at s1e1w` on the UART's physical address faults, and one on its
          # direct-map address returns that same physical address. Every line
          # after it — the device tree, fw_cfg's DMA, the framebuffer, the page
          # the allocator wrote through — is therefore going through the high
          # map, because there is no longer any other map to go through.
          #
          # The process marker says a second address space was built in
          # TTBR0, installed, and questioned with `at s1e0r`/`at s1e0w` — the
          # hardware confirming that a page mapped read-write for EL0
          # translates both ways, that a page mapped read-only translates for
          # a read and *faults* for a write, that the kernel's own mappings
          # survived the switch, and that every table page came back when the
          # space was torn down.
          #
          # The EL0 markers are the port's actual milestone. "hello from EL0
          # on aarch64" was not printed by the kernel: it was printed *by a
          # user program*, through write(2), naming a string by an address
          # that means nothing outside that process's page tables. The kernel
          # translated it rather than dereferencing it, which is both how the
          # pointer gets validated and the only way that is allowed to work
          # (see the PAN boot below).
          #
          # The program then read its own memory, was interrupted by the timer
          # while it ran and carried on, wrote its answer back where the kernel
          # could see it, and exited with a status the kernel checked — and
          # then, entered a second time, stored to its read-only text page and
          # had the CPU taken away from it. That last one is the one a kernel
          # that never really left EL1 could not produce.
          #
          # The init markers are a different claim again: that program was not
          # assembled into the kernel image. A compiler built it and a linker
          # laid it out into three segments with different permissions and a
          # .bss whose memory size exceeds its file size, and the loader had
          # to be right about all of it without being told.
          #
          # It runs *twice*, in two address spaces, and that is not repetition
          # for its own sake. The second run gets frames the first one just
          # returned, so ".bss zeroed" and ".data came from the file" only
          # hold if the loader really re-zeroed and re-copied them. Removing
          # the zeroing was measured to pass the first run and fail the
          # second.
          #
          # The program's exit status carries its own verdict, so a check it
          # reports as failed fails this gate rather than merely printing.
          #
          # And then the demo markers, which are what all of the above was
          # for: a Clarity program, compiled to C by `clarity cc
          # --freestanding` and linked against kernel/user/libc, running on
          # this architecture. The C is the same file the x86_64 side
          # compiles; the library is the same source, with an AArch64 half for
          # its three architecture-specific pieces — the system call stubs,
          # the entry point, and setjmp.
          #
          # The float line is checked literally, and not because printf is
          # fragile. Those three doubles come out of strtod, the library's own
          # arithmetic, a hardware square root and dtoa, and a subtly wrong
          # one of those still prints a plausible number. Requiring the exact
          # digits — the same digits the x86_64 gate requires — is what makes
          # that a check rather than a look.
          #
          # The heap marker is the one a C library will sit on. brk(0) reports
          # the break, asking for more maps pages that were not there, and the
          # program writes through the new break and reads it back — because
          # the kernel returning the number it was asked for proves nothing
          # about whether anything was mapped.
          #
          # The last two markers are about threads rather than processes. The
          # trace has to be exactly ABABABa: a switch that went nowhere leaves
          # a letter repeated and a switch that lost a thread leaves it short.
          # The preemption line is printed only when neither thread ever
          # yielded, the CPU changed hands at least six times, and — the part
          # counters alone cannot see — every thread resumed inside its own
          # code rather than the other's.
          if grep -q "\[ok\] device tree at" serial-arm.log \
             && grep -q "\[ok\] identity map dropped:" serial-arm.log \
             && grep -q "\[ok\] direct map covers all of RAM" serial-arm.log \
             && grep -q "\[ok\] process address space:" serial-arm.log \
             && grep -q "hello from EL0 on aarch64" serial-arm.log \
             && grep -q "\[ok\] EL0: a program wrote" serial-arm.log \
             && grep -q "\[ok\] EL0: the timer interrupted it" serial-arm.log \
             && grep -q "\[ok\] EL0: and when it wrote to its read-only text" serial-arm.log \
             && grep -q "\[ok\] context switch: ABABABa" serial-arm.log \
             && grep -q "\[ok\] preemption: B ran" serial-arm.log \
             && grep -q "\[ok\] allocator under two threads" serial-arm.log \
             && grep -q "\[ok\] scheduler: three threads rotated" serial-arm.log \
             && grep -q "\[ok\] scheduler: a high-priority thread ran" serial-arm.log \
             && grep -q "\[ok\] scheduler window:" serial-arm.log \
             && grep -q "\[ok\] process table:" serial-arm.log \
             && grep -q "\[ok\] processes: every program that ran gave back" serial-arm.log \
             && grep -q "\[ok\] /bin: 5 programs installed" serial-arm.log \
             && grep -q "\[ok\] exec: one process, two images" serial-arm.log \
             && grep -q "hello from /bin/clarity-init on aarch64" serial-arm.log \
             && grep -q "\[ok\] user .bss zeroed" serial-arm.log \
             && grep -q "\[ok\] user .data came from the file" serial-arm.log \
             && grep -q "\[ok\] user fp: 355/113" serial-arm.log \
             && grep -q "\[ok\] user heap: brk grew" serial-arm.log \
             && grep -q "\[ok\] init: a compiled, linked ELF ran at EL0 twice" serial-arm.log \
             && grep -q "clarity-demo: all checks passed" serial-arm.log \
             && grep -q "float 3.1415929203539825 1.4142135623730951 6.25" serial-arm.log \
             && grep -q "\[ok\] demo: a Clarity program ran on aarch64" serial-arm.log \
             && grep -q "\[ok\] console on screen:" serial-arm.log \
             && grep -q "\[ok\] console: 95 glyphs drawn, screen scrolled" serial-arm.log \
             && grep -q "\[ok\] keyboard: virtio-input" serial-arm.log \
             && grep -q "\[ok\] keyboard: interrupt .* routed to this core" serial-arm.log \
             && grep -q "\[ok\] command line: read 3 seconds idle (asked for)" serial-arm.log \
             && grep -q "\[ok\] vfs: path resolve, create, write, read back" serial-arm.log \
             && grep -q "\[ok\] vfs: readdir packed" serial-arm.log \
             && grep -q "\[ok\] console input:" serial-arm.log \
             && grep -q "init: nothing typed, end of input" serial-arm.log \
             && grep -q "\[--\] shell: no keyboard\|\[ok\] shell: ran at EL0" serial-arm.log \
             && grep -q "\[ok\] pmm:" serial-arm.log \
             && grep -q "\[ok\] framebuffer:" serial-arm.log \
             && grep -q "KyanOS aarch64: EL1 boot ok" serial-arm.log \
             && grep -q "\[ok\] aarch64 timer: interrupts delivered" serial-arm.log \
             && ! grep -q "\[FAIL\]" serial-arm.log; then
            echo "PASS: aarch64 reached EL1 in the high half, read its device tree, allocated a page, and drew a screen"
          else
            echo "FAIL: aarch64 boot, address space, device tree, page allocator or screen did not come up"
            exit 1
          fi

      # A CPU that implements Privileged Access Never.
      #
      # The kernel never dereferences an address userspace gave it: a user
      # pointer is translated through the process's own page tables and read
      # through the kernel's direct map. PAN is what turns that from a rule
      # this code follows into one the hardware enforces — with SCTLR_EL1.SPAN
      # cleared, any EL1 access to memory EL0 can reach faults.
      #
      # cortex-a72 is ARMv8.0 and has no PAN, so the boot above cannot tell an
      # enforced rule from a followed one. That was measured, not assumed:
      # making sys_write dereference the user pointer directly boots fine on
      # cortex-a72 and takes a permission fault on this one, at the exact
      # address the program passed in. Which is the whole failure mode —
      # correct on the machine it was tested on, and not on the next.
      - name: Boot on a PAN-capable CPU
        run: |
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu max \
            -m 512 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64.img \
            -device ramfb \
            -device virtio-keyboard-device \
            -append "clarity.idle=3" \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm-pan.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm-pan.log
          echo "-------------------------"
          if grep -q "hello from EL0 on aarch64" serial-arm-pan.log \
             && grep -q "\[ok\] keyboard: virtio-input" serial-arm-pan.log \
             && grep -q "\[ok\] keyboard: interrupt .* routed to this core" serial-arm-pan.log \
             && grep -q "\[ok\] command line: read 3 seconds idle (asked for)" serial-arm-pan.log \
             && grep -q "\[ok\] vfs: path resolve, create, write, read back" serial-arm-pan.log \
             && grep -q "\[ok\] vfs: readdir packed" serial-arm-pan.log \
             && grep -q "\[ok\] console input:" serial-arm-pan.log \
             && grep -q "init: nothing typed, end of input" serial-arm-pan.log \
             && grep -q "\[--\] shell: no keyboard\|\[ok\] shell: ran at EL0" serial-arm-pan.log \
             && grep -q "\[ok\] EL0: a program wrote" serial-arm-pan.log \
             && grep -q "\[ok\] preemption: B ran" serial-arm-pan.log \
             && grep -q "\[ok\] init: a compiled, linked ELF ran at EL0 twice" serial-arm-pan.log \
             && grep -q "KyanOS aarch64: EL1 boot ok" serial-arm-pan.log \
             && ! grep -q "AARCH64 EXCEPTION" serial-arm-pan.log \
             && ! grep -q "\[FAIL\]" serial-arm-pan.log; then
            echo "PASS: the kernel never touched a user address directly"
          else
            echo "FAIL: PAN caught the kernel dereferencing user memory, or the boot broke"
            exit 1
          fi

      # The interrupt controller Apple hardware forces.
      #
      # Apple Silicon has no GIC at all — the real controller is Apple's AIC —
      # so a Mac running this under QEMU gets an emulated one, and under HVF
      # acceleration QEMU emulates only a GICv3: `-accel hvf` with a GICv2
      # answers "HVF does not support GICv2 emulation" and refuses to start.
      # The kernel therefore has to speak both, and the boot above only
      # exercises the GICv2 that `virt` builds by default.
      #
      # This is the same image on the same emulator with one flag changed, so
      # a difference in the output is the interrupt controller and nothing
      # else. The timer marker is the one that matters: on a GICv3 a private
      # interrupt is enabled in the core's redistributor rather than in the
      # distributor, and writing it to the distributor is *accepted* and
      # delivers nothing — measured, by doing exactly that: ticks=0 and
      # fifteen markers instead of forty, with no fault to say why.
      - name: Boot on a GICv3, the controller Apple hardware forces
        run: |
          timeout 120 qemu-system-aarch64 \
            -M virt,gic-version=3 \
            -cpu max \
            -m 512 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64.img \
            -device ramfb \
            -device virtio-keyboard-device \
            -append "clarity.idle=3" \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm-gicv3.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm-gicv3.log
          echo "-------------------------"
          if grep -q "\[ok\] interrupt controller: GICv3" serial-arm-gicv3.log \
             && grep -q "\[ok\] aarch64 timer: interrupts delivered" serial-arm-gicv3.log \
             && grep -q "\[ok\] keyboard: interrupt .* routed to this core" serial-arm-gicv3.log \
             && grep -q "\[ok\] EL0: the timer interrupted it" serial-arm-gicv3.log \
             && grep -q "\[ok\] preemption: B ran" serial-arm-gicv3.log \
             && grep -q "\[ok\] init: a compiled, linked ELF ran at EL0 twice" serial-arm-gicv3.log \
             && grep -q "KyanOS aarch64: EL1 boot ok" serial-arm-gicv3.log \
             && ! grep -q "AARCH64 EXCEPTION" serial-arm-gicv3.log \
             && ! grep -q "\[FAIL\]" serial-arm-gicv3.log; then
            echo "PASS: redistributor woken, PPI and SPI delivered, EOI through the system registers"
          else
            echo "FAIL: the GICv3 path is broken — a Mac cannot run this accelerated"
            exit 1
          fi

      # And that the GICv2 path the default `virt` builds is still the one
      # taken there, so "both are supported" is not one of them quietly
      # winning. The boots above assert the GICv2 behaviour; this asserts the
      # kernel says so, which is what makes the line above meaningful.
      - name: Assert the default machine is still driven as a GICv2
        run: |
          grep -q "\[ok\] interrupt controller: GICv2" serial-arm.log \
            || { echo "FAIL: the default virt machine is no longer detected as a GICv2"; exit 1; }
          echo "PASS: default virt is a GICv2 and is driven as one"

      # A machine with more RAM than the boot stub could map on its own.
      #
      # The stub runs before anything has read the device tree, so all it can
      # map is the gigabyte it found itself loaded into. On the 512 MiB boot
      # above that is already the whole machine, and the code that extends the
      # map afterwards runs but has nothing to do — it would pass with that
      # code deleted. Four gigabytes is three blocks the kernel can only reach
      # because it read the tree and mapped them, and the marker is printed
      # only after the MMU has been asked to translate the last byte of RAM
      # and has answered with the right physical address.
      - name: Boot with 4 GiB and assert the direct map was extended
        run: |
          timeout 120 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a72 \
            -m 4096 \
            -kernel kernel/zig-out/bin/clarity-kernel-aarch64.img \
            -device ramfb \
            -device virtio-keyboard-device \
            -append "clarity.idle=3" \
            -serial stdio \
            -display none \
            -no-reboot \
            > serial-arm-4g.log 2>&1 || true
          echo "----- serial output -----"
          cat serial-arm-4g.log
          echo "-------------------------"
          if grep -q "\[ok\] direct map covers all of RAM (3 GiB added" serial-arm-4g.log \
             && grep -q "\[ok\] keyboard: virtio-input" serial-arm-4g.log \
             && grep -q "\[ok\] keyboard: interrupt .* routed to this core" serial-arm-4g.log \
             && grep -q "\[ok\] command line: read 3 seconds idle (asked for)" serial-arm-4g.log \
             && grep -q "\[ok\] vfs: path resolve, create, write, read back" serial-arm-4g.log \
             && grep -q "\[ok\] vfs: readdir packed" serial-arm-4g.log \
             && grep -q "\[ok\] console input:" serial-arm-4g.log \
             && grep -q "init: nothing typed, end of input" serial-arm-4g.log \
             && grep -q "\[--\] shell: no keyboard\|\[ok\] shell: ran at EL0" serial-arm-4g.log \
             && grep -q "\[ok\] pmm: 4096 MiB managed" serial-arm-4g.log \
             && grep -q "\[ok\] process address space:" serial-arm-4g.log \
             && grep -q "\[ok\] EL0: a program wrote" serial-arm-4g.log \
             && grep -q "\[ok\] preemption: B ran" serial-arm-4g.log \
             && grep -q "\[ok\] init: a compiled, linked ELF ran at EL0 twice" serial-arm-4g.log \
             && grep -q "KyanOS aarch64: EL1 boot ok" serial-arm-4g.log \
             && ! grep -q "\[FAIL\]" serial-arm-4g.log; then
            echo "PASS: the direct map was extended over all 4 GiB and the allocator manages it"
          else
            echo "FAIL: the kernel did not map all of a 4 GiB machine"
            exit 1
          fi

      # The kernel reading its own framebuffer back proves the memory holds
      # what was written. It cannot prove that memory is the screen: a kernel
      # that configured ramfb wrongly, or not at all, would still agree with
      # itself. Asking QEMU for a picture is what closes that gap — this boots
      # again with a monitor socket, takes a screendump, and checks the exact
      # colours at the exact coordinates main_aarch64.zig draws them.
      - name: Screenshot the display and check the pixels
        run: python3 kernel/tools/fb_check.py kernel/zig-out/bin/clarity-kernel-aarch64.img

      # The vfs marker is fstest.zig — the same file the x86_64 job runs, not
      # a second copy of it. fs/vfs.zig and fs/tmpfs.zig needed no change to
      # run here, so what this asserts is that the shared code really is
      # shared: a port that quietly forked it would produce this same line.
      #
      # A note on the marker these three boots require from read(2).
      #
      # Nobody types during them, so what they assert is the *end of input*
      # path: the init program calls read(0, ...), waits, and is told there is
      # nothing — which is what a closed stdin looks like and what a shell has
      # to handle. That the call reaches a program at all is the claim; that
      # it delivers a line is the typing step's, below.
      #
      # The boots above prove the kernel finds a keyboard and runs the line
      # discipline. They cannot prove either one works: "0 lines" is what a
      # perfectly working driver reports when nobody is typing, so no marker
      # in a log nobody typed into can tell that from a queue the device never
      # writes to.
      #
      # This boots again with QEMU's monitor on a socket and types two lines.
      #
      # The first is the alphabet twice: fifty-two keys, which QEMU turns into
      # four events each, so well over two hundred events through a virtqueue
      # of sixty-four. A driver that never hands its buffers back delivers the
      # first sixteen keys and goes quiet — which is the bug this length is
      # here to catch, found by typing seven keys into an eight-deep queue and
      # reading back six.
      #
      # The second is "helxo", two backspaces, "lo". The kernel must end up
      # holding "hello" and the *screen* must show "hello" — those are two
      # different claims, and a console that echoed the backspaces without
      # erasing anything satisfies the first and not the second. So this step
      # also screenshots the display and checks every character cell against a
      # replay of the serial log, using fb_check's own model of the console.
      #
      # The shell marker is deliberately either-or. These three boots attach a
      # keyboard but nobody types, so the shell starts, reads end of input
      # after three seconds and exits — that is the "[ok] shell" branch. A
      # boot with no keyboard at all says so instead and skips it. What is
      # being asserted is that one of the two happened rather than the shell
      # silently not running, which is what a missing embed would look like.
      #
      # It also types a line at the *program*: after the boot selftest, the
      # compiled ELF at EL0 calls read(2) twice — once with a pointer into its
      # own read-only text, which the kernel must refuse because it translates
      # the buffer for writing, and once with a real buffer, which must get
      # back the line the refusal did not eat.
      - name: Type at the keyboard and check what it read and drew
        run: python3 kernel/tools/key_check.py kernel/zig-out/bin/clarity-kernel-aarch64.img

      # And the same machine with no keyboard and no display at all, typed at
      # down its serial line.
      #
      # This is the path a person actually uses. The PL011 was write-only
      # until recently, so the only way into this kernel was a virtio keyboard
      # — which means a graphical window, which means finding it, focusing it,
      # and letting it capture the pointer before a text prompt would listen.
      # Reported from an M5 Mac as "I can't type in there at all", which was
      # accurate and which every test here passed straight through.
      #
      # It attaches no keyboard on purpose, and fails if it finds one: with a
      # keyboard present every assertion in it would pass without the serial
      # line ever being read.
      - name: Type down the serial line with no keyboard attached
        run: python3 kernel/tools/serial_check.py kernel/zig-out/bin/clarity-kernel-aarch64.img

      # ── The developer command produces the same boot ───────────────────
      #
      # Everything above is what this workflow does by hand. `clarity os
      # build` and `clarity os run` are what a person is told to run, so the
      # gate proves those give the same boot: the same kernel build, the same
      # image recipe, the same QEMU flags, the same serial marker. Before this
      # step existed `clarity os build` tried to build a QuickJS runtime that
      # nothing vendors and stopped there, and the image it would have written
      # was not bootable; the docs called it the developer workflow anyway.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the clarity binary
        run: |
          rm -rf native/dist
          python native/transpile.py --bundle
          (cd native/dist && bun build --compile clarity-entry.js --outfile clarity)

      - name: clarity os build writes the image and clarity os run boots it (aarch64)
        run: |
          rm -rf dist
          ./native/dist/clarity os build --arch aarch64
          test -f dist/claritos-aarch64.img
          ./native/dist/clarity os run --arch aarch64 --no-rebuild --boot-test --timeout 150
