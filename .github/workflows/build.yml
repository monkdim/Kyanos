name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  # A change to this file builds all five targets on the pull request, so the
  # pipeline is exercised before a tag depends on it. The release job below
  # still runs only for a tag.
  pull_request:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            bun_target: bun-darwin-arm64
            bootstrap_target: darwin-arm64
            binary: clarity
            run_smoke: true
          # darwin-x64 is cross-compiled from a Linux runner — Bun targets
          # the binary regardless of host, and macos-13 has the slowest
          # GitHub Actions queue. Smoke tests skip here since a Mach-O
          # binary can't run on Linux; darwin-arm64 covers macOS coverage.
          - os: ubuntu-latest
            target: darwin-x64
            bun_target: bun-darwin-x64
            bootstrap_target: linux-x64
            binary: clarity
            run_smoke: false
          - os: ubuntu-latest
            target: linux-x64
            bun_target: bun-linux-x64
            bootstrap_target: linux-x64
            binary: clarity
            run_smoke: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            bun_target: bun-linux-arm64
            bootstrap_target: linux-arm64
            binary: clarity
            run_smoke: true
          - os: windows-latest
            target: windows-x64
            bun_target: bun-windows-x64
            bootstrap_target: windows-x64
            binary: clarity.exe
            run_smoke: false
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The previous release's binary rebuilds the toolchain. Windows releases
      # are a .zip holding clarity.exe; the others are a .tar.gz holding
      # clarity. A release with no assets (or no release at all) makes this
      # step fail, and the Python bundler below takes over.
      - name: Bootstrap from latest release
        id: bootstrap
        run: |
          set -euo pipefail
          BASE=https://github.com/monkdim/Kyanos/releases/latest/download
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -fsSL "$BASE/clarity-${{ matrix.bootstrap_target }}.zip" -o clarity-bootstrap.zip
            7z x -y clarity-bootstrap.zip
          else
            curl -fsSL "$BASE/clarity-${{ matrix.bootstrap_target }}.tar.gz" -o clarity-bootstrap.tar.gz
            tar xzf clarity-bootstrap.tar.gz
          fi
          chmod +x ${{ matrix.binary }}
          mv ${{ matrix.binary }} clarity-bootstrap-${{ matrix.binary }}
          rm -rf native/dist
          ./clarity-bootstrap-${{ matrix.binary }} transpile --bundle
          test -f native/dist/clarity-entry.js
        shell: bash
        continue-on-error: true

      - name: Bootstrap fallback (no usable previous release)
        if: steps.bootstrap.outcome != 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Start from an empty directory: a bundle the bootstrap half wrote must
      # not fill in for a module this bundler forgot.
      - name: Transpile via Python fallback
        if: steps.bootstrap.outcome != 'success'
        run: |
          rm -rf native/dist
          python native/transpile.py --bundle
        shell: bash

      - name: Compile native binary
        run: |
          cd native/dist
          bun build --compile --target=${{ matrix.bun_target }} clarity-entry.js --outfile ${{ matrix.binary }}

      - name: Run smoke tests
        if: matrix.run_smoke
        run: ./native/dist/clarity smoke ./native/dist/clarity

      - name: Package binary
        run: |
          cd native/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../clarity-${{ matrix.target }}.zip ${{ matrix.binary }}
          else
            tar czf ../../clarity-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-${{ matrix.target }}
          path: clarity-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The changelog is the log between the previous tag and this one, so
      # the whole history and every tag have to be present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            echo "body=Initial release of Clarity $CURRENT_TAG" >> $GITHUB_OUTPUT
          else
            CHANGES=$(git log --pretty=format:"- %s" "$PREV_TAG".."$CURRENT_TAG" | head -50)
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> $GITHUB_OUTPUT
            echo "## What's Changed" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$CHANGES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "## Installation" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "curl -fsSL https://raw.githubusercontent.com/monkdim/Kyanos/main/install.sh | bash" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Or with Homebrew:" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "brew tap monkdim/clarity https://github.com/monkdim/Kyanos" >> $GITHUB_OUTPUT
            echo "brew install monkdim/clarity/clarity" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
