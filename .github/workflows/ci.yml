name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bootstrap from latest release
        id: bootstrap
        run: |
          curl -fsSL https://github.com/monkdim/Kyanos/releases/latest/download/clarity-${{ matrix.target }}.tar.gz -o clarity-bootstrap.tar.gz
          tar xzf clarity-bootstrap.tar.gz
          chmod +x clarity
          mv clarity clarity-bootstrap
          ./clarity-bootstrap transpile --bundle
        continue-on-error: true

      - name: Bootstrap fallback (pre-first-release)
        if: steps.bootstrap.outcome != 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Transpile via Python fallback
        if: steps.bootstrap.outcome != 'success'
        run: python native/transpile.py --bundle

      - name: Install libcapstone (Linux, for the disassembler test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev

      - name: Compile native binary
        run: |
          cd native/dist
          bun build --compile clarity-entry.js --outfile clarity

      # The binary above was bundled by the *previous release's* transpiler,
      # whose runtime import header is that release's and cannot name
      # anything added since. A builtin added in this PR is therefore an
      # undefined variable in it, so testing that binary tests the release's
      # compiler against this checkout's standard library — and fails for a
      # reason no reviewer of the diff can see.
      #
      # So it is used for one thing only, which is the thing worth proving:
      # that the released compiler can still build this source tree. What
      # gets tested is what it builds.
      - name: Rebuild with the compiler in this checkout
        run: |
          ./native/dist/clarity transpile --bundle -o stage2
          (cd stage2 && bun build --compile clarity-entry.js --outfile clarity)
          ./stage2/clarity --version

      - name: Run self-hosted tests
        run: ./stage2/clarity test stdlib/

      - name: Run smoke tests
        run: ./stage2/clarity smoke ./stage2/clarity

  selfhost:
    runs-on: ubuntu-latest
    name: Self-hosting bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The compiler must be able to rebuild itself from its own sources.
      # Without this gate the Python transpiler silently carries the build:
      # the self-hosted one drifted far enough that its output would not even
      # parse, and nothing failed.
      - name: Stage 1 — seed the compiler with the Python reference transpiler
        run: |
          python native/transpile.py --bundle
          (cd native/dist && bun build --compile clarity-entry.js --outfile clarity)

      # Into an empty directory, on purpose. This stage used to write over
      # native/dist, and the Python bundler's files filled every hole in the
      # self-hosted one: a bundle it could not have produced alone passed
      # here for months, while `clarity transpile --bundle` into a fresh
      # directory produced a binary that could not start.
      - name: Stage 2 — the compiler regenerates its own bundle, from nothing
        run: |
          ./native/dist/clarity transpile --bundle -o /tmp/stage2
          (cd /tmp/stage2 && bun build --compile clarity-entry.js --outfile clarity)
          /tmp/stage2/clarity --version

      # Both bundlers derive the module set from the directory by the same
      # rule; this is what says they still agree.
      - name: The self-hosted bundle ships the same modules as the reference one
        run: |
          diff <(cd native/dist && ls *.js | sort) <(cd /tmp/stage2 && ls *.js | sort) \
            && echo "PASS: identical module sets" \
            || { echo "FAIL: the two bundlers emitted different module sets"; exit 1; }

      - name: Stage 3 — and again, then require a fixpoint
        run: |
          /tmp/stage2/clarity transpile --bundle -o /tmp/stage3
          (cd /tmp/stage3 && bun build --compile clarity-entry.js --outfile clarity)
          if diff -rq --exclude=clarity /tmp/stage2 /tmp/stage3; then
            echo "PASS: the compiler reproduces itself byte for byte"
          else
            echo "FAIL: stage 2 and stage 3 output differ"
            exit 1
          fi

      # The disassembler test binds libcapstone at runtime; without it that
      # native check produces no output and the suite fails for a reason that
      # has nothing to do with self-hosting.
      - name: Install libcapstone
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev

      # A fixpoint on broken output is still broken, so the self-hosted build
      # has to pass everything the reference build does.
      - name: Self-hosted build passes the full suite
        run: /tmp/stage3/clarity test stdlib/

      - name: Self-hosted build passes the smoke tests
        run: /tmp/stage3/clarity smoke /tmp/stage3/clarity

  # The editor extension is a shipping artifact, and it was broken in a way
  # nothing here would have caught: it did not compile (no @types/node), its
  # language client was a devDependency so the packaged .vsix left it out and
  # activation threw, and its formatter called a flag the CLI did not have.
  # This job builds it the way a publisher would and runs it against a real
  # binary.
  vscode-extension:
    runs-on: ubuntu-latest
    name: VS Code extension
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build a clarity binary for the extension to talk to
        run: |
          python native/transpile.py --bundle
          (cd native/dist && bun build --compile clarity-entry.js --outfile clarity)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: npm install

      - name: Compile it
        working-directory: editors/vscode
        run: npm run compile

      - name: Activate it and format a file through it
        working-directory: editors/vscode
        run: CLARITY_BIN="$GITHUB_WORKSPACE/native/dist/clarity" npm test

      - name: Package it, and require the language client to be inside
        working-directory: editors/vscode
        run: |
          npx vsce package --out clarity-lang.vsix
          unzip -l clarity-lang.vsix > contents.txt
          cat contents.txt
          grep -q 'extension/out/extension.js' contents.txt \
            || { echo "FAIL: the compiled extension is not in the package"; exit 1; }
          grep -q 'node_modules/vscode-languageclient/' contents.txt \
            || { echo "FAIL: vscode-languageclient is missing; activation would throw"; exit 1; }
